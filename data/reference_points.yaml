# Globale Konventions-Referenz, NICHT mehr der Ort fuer Sequenz-spezifische
# Ground-Truth-Wegpunkte (siehe Format-Umstellung 2026-09-15,
# docs/decisions.md): jede Sequenz unter data/vo_sequences/<name>/ hat
# jetzt ihre eigene ground_truth.yaml direkt neben den Bildern, weil
# mehrere Sequenzen unterschiedliche Routen/Frame-Zahlen haben und sich
# keine gemeinsame, positionsbasierte Punktliste teilen koennen.
#
# Rolle seit dem Methodenwechsel zu Visueller Odometrie (siehe
# docs/decisions.md, 2026-09-04): NICHT als Laufzeit-Karte fuer PnP
# genutzt. Der Startpunkt-Ursprung ist ohnehin per Konvention immer
# [0, 0, 0] (= erste Kameraposition, Frame 0) und wird von
# run_vo_pipeline() nicht aus dieser Datei gelesen -- diese Datei
# dokumentiert die Konvention, speichert aber keine Laufzeitdaten mehr.
#
# Achsenkonvention: Weltursprung = erste Kameraposition (Frame 0), Achsen
# folgen der OpenCV-Kamerakonvention (x = nach rechts aus Kamerasicht,
# y = nach unten, z = in die Szene hinein) -- siehe run_vo_pipeline()
# (src/localization/vo_pipeline.py), triangulierte Punkte liegen im
# Koordinatensystem der ersten linken Kamera. Eine Bewegung nach LINKS aus
# Kamerasicht ist also negatives x.
#
# Format je Sequenz (in data/vo_sequences/<name>/ground_truth.yaml):
# points:
#   <id>: [x, y, z]
points: {}
